# window border
window.active.border.color: #abcaea
window.inactive.border.color: #bcc8d6

# ToggleKeybinds status indicator
window.active.indicator.toggled-keybind.color: #ffb4ab

# window titlebar background
window.active.title.bg.color: #abcaea
window.inactive.title.bg.color: #bcc8d6

window.active.label.text.color: #12334c
window.inactive.label.text.color: #27313c
window.label.text.justify: center

# window button hover overlay
window.button.hover.bg.color: #292a2c

# window buttons
window.active.button.unpressed.image.color: #12334c
window.inactive.button.unpressed.image.color: #12334c

# menu
menu.border.color: #12334c
menu.items.bg.color: #abcaea
menu.items.text.color: #12334c
menu.items.active.bg.color: #bcc8d6
menu.items.active.text.color: #27313c
menu.separator.color: #12334c
menu.title.bg.color: #abcaea
menu.title.text.color: #12334c

# on screen display (window-cycle dialog)
osd.bg.color: #abcaea
osd.border.color: #12334c
osd.label.text.color: #12334c
osd.window-switcher.preview.border.color: #8d9198
