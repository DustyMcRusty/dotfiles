# window border
window.active.border.color: #4c7899
window.inactive.border.color: #2e9ef4

# ToggleKeybinds status indicator
window.active.indicator.toggled-keybind.color: #900000

# window titlebar background
window.active.title.bg.color: #4c7899
window.inactive.title.bg.color: #2e9ef4

window.active.label.text.color: #ffffff
window.inactive.label.text.color: #111111
window.label.text.justify: center

# window button hover overlay
window.button.hover.bg.color: #3d3d3d

# window buttons
window.active.button.unpressed.image.color: #ffffff
window.inactive.button.unpressed.image.color: #ffffff

# menu
menu.border.color: #ffffff
menu.items.bg.color: #4c7899
menu.items.text.color: #ffffff
menu.items.active.bg.color: #2e9ef4
menu.items.active.text.color: #111111
menu.separator.color: #ffffff
menu.title.bg.color: #4c7899
menu.title.text.color: #ffffff

# on screen display (window-cycle dialog)
osd.bg.color: #4c7899
osd.border.color: #ffffff
osd.label.text.color: #ffffff
osd.window-switcher.preview.border.color: #666d6f
