# window border
window.active.border.color: #d5c4af
window.inactive.border.color: #cfc5bb

# ToggleKeybinds status indicator
window.active.indicator.toggled-keybind.color: #ffb4ab

# window titlebar background
window.active.title.bg.color: #d5c4af
window.inactive.title.bg.color: #cfc5bb

window.active.label.text.color: #392f20
window.inactive.label.text.color: #352f29
window.label.text.justify: center

# window button hover overlay
window.button.hover.bg.color: #2b2a28

# window buttons
window.active.button.unpressed.image.color: #392f20
window.inactive.button.unpressed.image.color: #392f20

# menu
menu.border.color: #392f20
menu.items.bg.color: #d5c4af
menu.items.text.color: #392f20
menu.items.active.bg.color: #cfc5bb
menu.items.active.text.color: #352f29
menu.separator.color: #392f20
menu.title.bg.color: #d5c4af
menu.title.text.color: #392f20

# on screen display (window-cycle dialog)
osd.bg.color: #d5c4af
osd.border.color: #392f20
osd.label.text.color: #392f20
osd.window-switcher.preview.border.color: #988f86
