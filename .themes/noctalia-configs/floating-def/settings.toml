config_version = 15

[bar.default]
border = "surface_variant"
border_width = 20.0
capsule = true
capsule_border_width = 1.5
capsule_fill = "surface"
capsule_opacity = 0.64999998547136784
capsule_thickness = 0.86999998427927494
center = []
color = "primary"
concave_edge_corners = false
end = [ "tray", "privacy", "clipboard", "network", "volume", "clock", "notifications" ]
icon_color = "primary"
margin_ends = 0
padding = 21
position = "bottom"
radius = 0
shadow = false
smart_auto_hide = true
start = [ "launcher", "control-center", "workspaces", "taskbar" ]
thickness = 36

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "wallpaper"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[location]
auto_locate = true

[lockscreen]
blur_intensity = 0.19999999552965164
enabled = false
transition = [ "honeycomb" ]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 683.0
    cy = 586.0
    output = "HDMI-A-1"
    placement_height = 768.0
    placement_width = 1366.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true
force = true
temperature_day = 6600
temperature_night = 6500

[shell.launcher]
app_grid = true
category_icons_only = true
compact = true
default_view = "pinned"
provider_prefix = "%"

[shell.panel]
launcher_placement = "attached"
open_near_click_control_center = true
open_near_click_launcher = true

[shell.window_switcher]
style = "compact"

[theme]
source = "wallpaper"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "labwc", "qt" ]

[wallpaper]
edge_smoothness = 0.63999998569488525
transition = [ "honeycomb" ]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/apolonio/Pictures/papelocal/shuttle.jpg"

    [wallpaper.last]
    path = "/home/apolonio/Pictures/papelocal/shuttle.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/apolonio/Pictures/papelocal/shuttle.jpg"

[widget.launcher]
scale = 1.3500000000000001

[widget.network]
show_label = false

[widget.taskbar]
hidden_workspaces = [ "1", "2", "3", "4" ]
hide_empty_workspaces = true
only_active_workspace = true
show_window_title = true
show_workspace_label = false
workspace_label_placement = "centered"

[widget.workspaces]
labels_only_when_occupied = true